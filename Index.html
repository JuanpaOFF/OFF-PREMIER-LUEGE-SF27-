<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFF PREMIER LUEGE 26/27</title>

<style>
:root{
  --red:#e50920;
  --red2:#ff3048;
  --bg:#050811;
  --bg2:#0b1220;
  --card:#111b2c;
  --card2:#17243a;
  --text:#fff;
  --muted:#9ca9bd;
  --green:#27d17f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -20%,#20345b 0,transparent 40%),
    linear-gradient(135deg,#050811,#0a1020 55%,#050811);
  min-height:100vh;
  overflow-x:hidden;
}

/* ================= LOAD ================= */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#050811;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:opacity .8s,visibility .8s;
}

#loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-ball{
  width:65px;
  height:65px;
  border:4px solid #29364c;
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loader-title{
  margin-top:25px;
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.loader-title span{
  color:var(--red);
}

.loader-bar{
  width:220px;
  height:4px;
  background:#202b3e;
  margin-top:18px;
  overflow:hidden;
  border-radius:10px;
}

.loader-bar div{
  height:100%;
  width:0;
  background:var(--red);
  animation:loading 1.8s ease forwards;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes loading{
  to{width:100%}
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,8,17,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #233049;
}

.nav{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.logo span{
  color:var(--red);
}

nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:white;
}

.nav-btn{
  padding:10px 14px;
  background:transparent;
  border-radius:10px;
  white-space:nowrap;
  transition:.25s;
}

.nav-btn:hover,
.nav-btn.active{
  background:var(--red);
  box-shadow:0 0 20px rgba(229,9,32,.25);
  transform:translateY(-2px);
}

/* ================= PAGES ================= */

main{
  max-width:1250px;
  margin:auto;
  padding:30px 20px 130px;
}

.page{
  display:none;
}

.page.active{
  display:block;
  animation:pageIn .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* ================= HERO ================= */

.hero{
  min-height:520px;
  padding:55px;
  border-radius:30px;
  border:1px solid #293750;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 35%,rgba(229,9,32,.55),transparent 25%),
    radial-gradient(circle at 70% 90%,rgba(37,99,235,.2),transparent 30%),
    linear-gradient(120deg,#080c15,#111d32);
}

.hero:after{
  content:"⚽";
  position:absolute;
  right:-35px;
  bottom:-55px;
  font-size:270px;
  opacity:.055;
  animation:ballFloat 5s ease-in-out infinite;
}

@keyframes ballFloat{
  50%{transform:translateY(-20px) rotate(12deg)}
}

.hero h1{
  font-size:clamp(45px,8vw,90px);
  line-height:.88;
  position:relative;
  z-index:1;
}

.hero h1 span{
  color:var(--red);
}

.hero p{
  max-width:650px;
  color:var(--muted);
  font-size:18px;
  line-height:1.6;
  margin-top:25px;
  position:relative;
  z-index:1;
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
  position:relative;
  z-index:1;
}

.primary,
.secondary{
  padding:14px 20px;
  border-radius:11px;
  transition:.25s;
}

.primary{
  background:var(--red);
}

.secondary{
  background:#253249;
}

.primary:hover,
.secondary:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

/* ================= TITLES ================= */

.section-title{
  font-size:30px;
  margin:38px 0 20px;
}

.subtitle{
  color:var(--muted);
  margin-top:-12px;
  margin-bottom:20px;
}

/* ================= CARDS ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(145deg,var(--card),#0d1727);
  border:1px solid #273650;
  border-radius:18px;
  padding:23px;
  text-align:left;
  transition:.3s;
  animation:cardIn .55s both;
}

.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}
.card:nth-child(5){animation-delay:.24s}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.card:hover{
  transform:translateY(-7px);
  border-color:var(--red);
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.card-icon{
  font-size:35px;
  margin-bottom:15px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* ================= TABLE ================= */

.table-wrap{
  overflow-x:auto;
  background:var(--card);
  border:1px solid #273650;
  border-radius:18px;
  animation:tableIn .5s ease;
}

@keyframes tableIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,
td{
  padding:14px;
  border-bottom:1px solid #273650;
}

th{
  background:#1b2940;
  text-align:left;
  color:#cbd5e1;
}

tr{
  transition:.2s;
}

tbody tr:hover{
  background:#1a273
